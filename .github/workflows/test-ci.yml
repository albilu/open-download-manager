name: Test CI

on:
    workflow_call:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.sha }}

            - name: Build Docker image
              run: ./docker-build.sh build

            # Hermetic unit suite (integration/E2E suites are excluded from
            # the default run by core/pom.xml). Tests require aria2, yt-dlp,
            # httrack, tor and Xvfb — all provided by the project Docker
            # image (see AGENTS.md).
            - name: Run unit tests
              run: ./docker-build.sh test

            # Full suite: adds the integration and E2E tests excluded above
            # by running the Maven `integration` profile inside the same
            # image; these launch real aria2c, yt-dlp, httrack, tor and
            # proxychains processes and may reach the network.
            - name: Run integration tests
              run: ./docker-build.sh test-integration
