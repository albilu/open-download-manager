name: Build and Test for Linux

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Build Docker image
              run: docker build -t odm-dev .

            # Tests require aria2, yt-dlp, httrack, tor and Xvfb — all provided
            # by the project Docker image (see AGENTS.md).
            - name: Run tests
              run: ./docker-build.sh test

            # Packages (.deb/.rpm/.pkg.tar.xz) are produced by the
            # exec-maven-plugin executions in odm-gtk/pom.xml during install.
            - name: Build packages
              run: ./docker-build.sh package

            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: linux-packages
                  if-no-files-found: warn
                  path: |
                      odm-gtk/target/*.deb
                      odm-gtk/target/*.rpm
                      odm-gtk/target/*.pkg.tar.*
