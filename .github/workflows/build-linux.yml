name: Build and Test for Linux

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Build Docker image
              run: docker build -t odm-dev .

            # Tests require aria2, yt-dlp, httrack, tor and Xvfb — all provided
            # by the project Docker image (see AGENTS.md).
            - name: Run tests
              run: ./docker-build.sh test

            # Packaging (.deb/.rpm/.pkg.tar.zst) is rebuilt for the GTK4 app
            # in Step 7 (release hardening) — see docs/STATUS.md.
            - name: Build application
              run: docker run --rm -v "$(pwd):/app" -v "$HOME/.m2:/home/developer/.m2" odm-dev mvn -q -pl odm-gtk4 -am package -DskipTests
