# Test logging configuration for Open Download Manager Core Engine
# This configuration optimizes logging for test execution while providing
# sufficient detail for debugging test failures.

# Global logging level - INFO for general test execution, FINE for debugging
.level = INFO

# Console handler configuration
handlers = java.util.logging.ConsoleHandler

# Console handler settings
java.util.logging.ConsoleHandler.level = INFO
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter

# Simple formatter pattern for test output
java.util.logging.SimpleFormatter.format = [%1$tF %1$tT] [%4$-7s] %3$s: %5$s %n

# Component-specific logging levels

# Core engine components - INFO level for general operation
org.manager.ComponentFactory.level = INFO
org.manager.GlobalSettings.level = INFO
org.manager.DependencyManager.level = INFO

# Download manager - INFO for test verification
org.manager.download.level = INFO
org.manager.download.DownloadManager.level = INFO
org.manager.download.DownloadManagerImpl.level = INFO

# Clipboard functionality - FINE for detailed testing
org.manager.clipboard.level = FINE
org.manager.clipboard.ClipboardService.level = FINE
org.manager.clipboard.ClipboardMonitor.level = FINE
org.manager.clipboard.UrlDetector.level = FINE

# Tool managers - WARNING to reduce noise unless debugging
org.manager.tool.level = WARNING
org.aria2.level = WARNING
org.curl.level = WARNING
org.ytdlp.level = WARNING
org.httrack.level = WARNING
org.proxychains.level = WARNING
org.tor.level = WARNING

# Dependency injection - INFO for container operations
org.manager.di.level = INFO

# Folder monitoring - INFO for basic operations
org.manager.folder.level = INFO

# Proxy and scheduling - WARNING to reduce noise
org.manager.proxy.level = WARNING
org.manager.schedule.level = WARNING

# Utilities and exceptions - WARNING for important events only
org.manager.util.level = WARNING
org.manager.exception.level = WARNING

# Test framework logging - WARNING to avoid clutter
org.junit.level = WARNING
org.mockito.level = WARNING
org.awaitility.level = WARNING

# Performance monitoring during tests
# Enable FINE level for performance-related tests
org.manager.performance.level = FINE

# Integration test specific logging
# These can be enabled for debugging integration issues
# org.manager.CoreEngineIntegrationTest.level = FINE
# org.manager.clipboard.ClipboardServiceIntegrationTest.level = FINE
# org.manager.clipboard.ClipboardE2ETest.level = FINE

# Memory and resource monitoring
# Uncomment for debugging resource leaks
# org.manager.memory.level = FINE
# org.manager.resources.level = FINE

# Network-related testing (for HTTP downloads in tests)
sun.net.www.protocol.http.level = WARNING
sun.net.www.protocol.https.level = WARNING

# File I/O operations during tests
java.io.level = WARNING
java.nio.level = WARNING

# Threading and concurrency (useful for debugging race conditions)
java.util.concurrent.level = WARNING

# Clipboard system integration (for E2E tests)
java.awt.level = WARNING
java.awt.datatransfer.level = INFO

# Test-specific overrides for debugging
# Uncomment these lines when debugging specific test failures:

# For clipboard URL detection issues:
# org.manager.clipboard.UrlDetector.level = ALL

# For download creation problems:
# org.manager.download.DownloadManagerImpl.level = ALL

# For component factory issues:
# org.manager.ComponentFactory.level = ALL

# For dependency injection problems:
# org.manager.di.DependencyContainer.level = ALL

# Special configuration for CI/CD environments
# These settings help with automated test execution
ci.test.timeout.level = INFO
ci.test.memory.level = INFO
ci.test.performance.all = WARNING
