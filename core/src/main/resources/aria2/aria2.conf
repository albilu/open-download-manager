# Global/general options
# Persist aria2's per-download .aria2 control files. ODM's SQLite state is
# the sole restart/replay authority, so no global input/save-session file is
# configured here.
auto-save-interval=60             # seconds between saving control files
continue=true                     # resume partial files automatically

# Connection options
max-concurrent-downloads=4       # limit simultaneous downloads for stability
split=8                           # number of connections per download
min-split-size=10M                # minimum size to split
max-connection-per-server=4      # per-server connection limit
enable-http-keep-alive=true      # reuse connections

# Bandwidth control (optional)
# download-limit=0               # unlimited
# upload-limit=0                 # unlimited

# File allocation & disk cache
file-allocation=falloc            # fast fallocate to pre-allocate files
disk-cache=64M                    # memory buffer, reduces I/O calls

# Retry & timeout settings
max-tries=5                       # retry failed downloads up to 5 times
timeout=60                        # network inactivity timeout in seconds
retry-wait=5                      # seconds to wait between retries
connect-timeout=15                # TCP connect timeout

# Logging & quiet mode
enable-color=false                # disable color if logging to file
log-level=info                    # info/errors only
# ODM's application log is written under XDG_STATE_HOME; do not create a
# second aria2 log at a fixed system path.

# User-Agent & identification
user-agent="aria2/1.36.0"
# header=Accept:*/*

# Advanced options
bt-enable-lpd=true                # Local Peer Discovery for BitTorrent
bt-max-peers=55                   # max peers for torrent
bt-request-peer-speed-limit=50K    # throttle peer requests
seed-time=0.01                    # minimum seeding time
bt-save-metadata=true             # save .torrent metadata

# RPC interface
enable-rpc=true
rpc-listen-all=false             # disable remote connections
rpc-allow-origin-all=false       # tighten security
rpc-listen-port=6800
rpc-secret=YOUR_SECRET_TOKEN

# HTTP Authentication & Proxy (if needed)
# http-proxy=http://127.0.0.1:8080
# https-proxy=http://127.0.0.1:8080

# Other options
dragonfly=true                    # disable disk cache flush per piece (async I/O)
force-save=false                  # skip saving if no active tasks

# End of configuration
