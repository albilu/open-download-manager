# JUnit Platform Configuration for Open Download Manager Core Engine Tests
# This configuration optimizes test execution for the ODM core engine module

# Test execution configuration
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.mode.classes.default=concurrent

# Resource management for parallel execution
junit.jupiter.execution.parallel.config.strategy=dynamic
junit.jupiter.execution.parallel.config.dynamic.factor=1.0

# Test discovery configuration
junit.platform.discovery.listener.default=logging

# Display name generation
junit.jupiter.displayname.generator.default=org.junit.jupiter.api.DisplayNameGenerator$ReplaceUnderscores

# Test method ordering
junit.jupiter.testmethod.order.default=org.junit.jupiter.api.MethodOrderer$OrderAnnotation

# Test class ordering
junit.jupiter.testclass.order.default=org.junit.jupiter.api.ClassOrderer$OrderAnnotation

# Test instance lifecycle
junit.jupiter.testinstance.lifecycle.default=per_method

# Extensions auto-detection
junit.jupiter.extensions.autodetection.enabled=true

# Timeout configuration for different test types
junit.jupiter.execution.timeout.default=5m
junit.jupiter.execution.timeout.testable.method.default=30s
junit.jupiter.execution.timeout.testtemplate.method.default=1m

# Test execution conditions
junit.jupiter.conditions.deactivate=

# Parameter resolution
junit.jupiter.params.displayname.default={displayName} [{arguments}]

# Integration test specific configuration
junit.platform.launcher.interceptors.enabled=true

# Console output configuration
junit.platform.output.capture.stdout=true
junit.platform.output.capture.stderr=true

# Test result reporting
junit.platform.reporting.open.xml.enabled=true
junit.platform.reporting.output.dir=target/test-results

# Engine configuration
junit.vintage.execution.parallel.enabled=false

# Custom test tags for categorization
junit.platform.include.tags=
junit.platform.exclude.tags=slow,manual,gui-required

# Memory and performance test configuration
test.memory.max.heap=2g
test.performance.timeout.multiplier=2.0

# CI/CD specific configuration
ci.test.parallel.threads=4
ci.test.timeout.factor=1.5

# Test resource management
test.resources.cleanup.enabled=true
test.resources.temp.dir=target/test-temp

# Logging configuration for test execution
logging.test.level=INFO
logging.test.pattern=[%thread] %-5level %logger{36} - %msg%n

# Docker container test configuration
docker.test.network.timeout=30s
docker.test.volume.cleanup=true

# Clipboard test configuration (for E2E tests)
clipboard.test.enabled=true
clipboard.test.timeout=10s
clipboard.test.fallback.mock=true

# Download test configuration
download.test.mock.servers=true
download.test.real.urls=false
download.test.timeout=60s

# Performance benchmark configuration
benchmark.enabled=false
benchmark.warmup.iterations=3
benchmark.measurement.iterations=5

# Test data configuration
test.data.generated.cleanup=true
test.data.fixtures.path=src/test/resources/fixtures

# Environment-specific overrides
# These can be overridden via system properties or environment variables
test.environment.headless=auto
test.environment.docker=auto
test.environment.ci=auto
