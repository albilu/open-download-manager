# Flatpak bundle manifest for Open Download Manager.
# Consumes packaging/stage (type: dir) so the bundle ships the exact same
# payload as the deb/rpm/arch packages. GTK4 comes from the GNOME runtime.
# aria2 is bundled because ODM requires it at startup and the sandbox has no
# host tools; yt-dlp and HTTrack are bundled so media/mirror downloads work
# out of the box. proxychains/Tor are host-dependent and degrade gracefully.
app-id: io.github.odm_linux.open-download-manager
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: open-download-manager
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # A download manager needs direct network access for aria2 RPC and tools.
  - --share=network
  # Users choose arbitrary download destinations.
  - --filesystem=home
  - --talk-name=org.freedesktop.Notifications
  # StatusNotifier tray integration.
  - --talk-name=org.kde.StatusNotifierWatcher
  # The in-code GTK application id (org.odm) predates the flatpak id.
  - --own-name=org.odm
modules:
  - name: aria2
    buildsystem: autotools
    config-opts:
      - --with-libxml2
      - --without-expat
      - --with-openssl
      - --without-gnutls
      - --without-libgcrypt
      - --without-libnettle
      - --without-libgmp
      - --with-sqlite3
      - --with-zlib=/usr
      - --without-libcares
      - --without-libssh2
      - --without-libuv
      - --disable-rpath
    sources:
      - type: archive
        url: https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0.tar.xz
        sha256: 60a420ad7085eb616cb6e2bdf0a7206d68ff3d37fb5a956dc44242eb2f79b66b

  - name: httrack
    buildsystem: autotools
    config-opts:
      - --with-ssl=/usr
      - --with-zlib=/usr
      - --disable-rpath
    sources:
      - type: archive
        url: https://mirror.httrack.com/historical/httrack-3.49.2.tar.gz
        sha256: 3477a0e5568e241c63c9899accbfcdb6aadef2812fcce0173688567b4c7d4025

  - name: yt-dlp
    buildsystem: simple
    build-commands:
      - install -Dm755 yt-dlp /app/bin/yt-dlp
    sources:
      - type: file
        url: https://github.com/yt-dlp/yt-dlp/releases/download/2026.08.19/yt-dlp
        sha256: 1fa6733c37ea6fb51c99ad8fe785e7b7e5f3246c9b980230329d4fb72ed8d4d6

  - name: open-download-manager
    buildsystem: simple
    sources:
      - type: dir
        path: ../stage
    build-commands:
      # Payload: shaded jar + bundled jlink runtime, mirrored under /app
      - install -Dm644 opt/open-download-manager/odm.jar
        /app/opt/open-download-manager/odm.jar
      - mkdir -p /app/opt/open-download-manager && cp -a
        opt/open-download-manager/runtime
        /app/opt/open-download-manager/runtime
      # Launcher: always the bundled runtime inside the sandbox
      - |
        mkdir -p /app/bin
        printf '%s\n' '#!/bin/sh' \
          'exec /app/opt/open-download-manager/runtime/bin/java --enable-native-access=ALL-UNNAMED -jar /app/opt/open-download-manager/odm.jar "$@"' \
          > /app/bin/open-download-manager
        chmod 755 /app/bin/open-download-manager
      # Desktop entry renamed to the app-id
      - |
        mkdir -p /app/share/applications
        sed -e 's|^Exec=.*|Exec=open-download-manager %U|' \
            -e 's|^Icon=.*|Icon=io.github.odm_linux.open-download-manager|' \
            usr/share/applications/org.odm.desktop \
            > /app/share/applications/io.github.odm_linux.open-download-manager.desktop
        chmod 644 /app/share/applications/io.github.odm_linux.open-download-manager.desktop
      # Metainfo renamed to the app-id (stock icon included)
      - |
        mkdir -p /app/share/metainfo
        sed -e 's|<id>org.odm</id>|<id>io.github.odm_linux.open-download-manager</id>|' \
            -e 's|<launchable type="desktop-id">org.odm.desktop</launchable>|<launchable type="desktop-id">io.github.odm_linux.open-download-manager.desktop</launchable>|' \
            -e 's|<icon type="stock">open-download-manager</icon>|<icon type="stock">io.github.odm_linux.open-download-manager</icon>|' \
            usr/share/metainfo/org.odm.metainfo.xml \
            > /app/share/metainfo/io.github.odm_linux.open-download-manager.metainfo.xml
        chmod 644 /app/share/metainfo/io.github.odm_linux.open-download-manager.metainfo.xml
      # Hicolor icons renamed to the app-id (svg and png, every size)
      - |
        for d in usr/share/icons/hicolor/*/apps; do
          size="$(basename "$(dirname "$d")")"
          dest="/app/share/icons/hicolor/$size/apps"
          mkdir -p "$dest"
          for f in "$d"/open-download-manager.*; do
            [ -f "$f" ] || continue
            install -m644 "$f" "$dest/io.github.odm_linux.open-download-manager.${f##*.}"
          done
        done
      - |
        if [ -f usr/share/icons/hicolor/index.theme ]; then
          install -Dm644 usr/share/icons/hicolor/index.theme \
            /app/share/icons/hicolor/index.theme
        fi
      # License
      - install -Dm644 usr/share/licenses/open-download-manager/LICENSE
        /app/share/licenses/io.github.odm_linux.open-download-manager/LICENSE
