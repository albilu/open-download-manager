# Flathub submission manifest for Open Download Manager.
# Unlike packaging/flatpak/io.github.odm_linux.open-download-manager.yml (which consumes the prebuilt stage tree),
# this manifest builds the application from the git source offline, as required
# by Flathub. Maven dependencies are vendored into maven-sources.yml (harvest
# recipe in SUBMISSION.md); screenshots live in the upstream metainfo template.
app-id: io.github.odm_linux.open-download-manager
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
# Build toolchain: freedesktop SDK extensions only exist on freedesktop-style
# branches (25.08), which never match the GNOME runtime version (50), so the
# openjdk SDK extension cannot be used here. Instead the pinned Temurin JDK
# and Maven below bootstrap the Java build; both are removed from the final
# bundle by the top-level cleanup. Same approach the openjdk extension itself
# uses (it bootstraps from Adoptium binaries).
command: open-download-manager
cleanup:
  - /jdk
  - /maven
# flatpak-builder strips every ELF in /app after each module install; that
# breaks the SHA-512 hashes recorded in the JDK's lib/modules and makes
# jlink fail ("SHA-512 sum check failed!"). Ship binaries unstripped and
# keep debug sections in place for the same reason.
build-options:
  strip: false
  no-debuginfo: true
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --share=network
  - --filesystem=home
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  # The in-code GTK application id (org.odm) predates the flatpak id.
  - --own-name=org.odm
modules:
  # Pinned Temurin JDK 25 (build-only; removed by top-level cleanup).
  - name: temurin-jdk
    buildsystem: simple
    only-arches:
      - x86_64
    sources:
      - type: archive
        url: https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.4.1%2B1/OpenJDK25U-jdk_x64_linux_hotspot_25.0.4.1_1.tar.gz
        sha256: dbb698396d478e7fa2b1e50f4103324b2a99b90569ee27c33f2261f9215cf41e
        strip-components: 0
    build-commands:
      # Copy the JDK tree wholesale: the jimage records hashes for every
      # shipped file (including man pages), and jlink fails when any
      # recorded file is missing from the copied tree.
      - mkdir -p /app/jdk && cp -a jdk-*/. /app/jdk/ && /app/jdk/bin/java -version

  # Pinned Apache Maven (build-only; removed by top-level cleanup).
  - name: apache-maven
    buildsystem: simple
    sources:
      - type: archive
        url: https://archive.apache.org/dist/maven/maven-3/3.9.15/binaries/apache-maven-3.9.15-bin.tar.gz
        sha256: 36182f85e91128cd5c4608462ac92194e7a30638f65034de66f4e1b00600a6fc
    build-commands:
      - |
        set -e
        mkdir -p /app/maven
        if [ -d apache-maven-3.9.15 ]; then
          cp -a apache-maven-3.9.15/. /app/maven/
        else
          cp -a bin boot conf lib /app/maven/
        fi

  - name: aria2
    buildsystem: autotools
    config-opts:
      - --with-libxml2
      - --without-expat
      - --with-openssl
      - --without-gnutls
      - --without-libgcrypt
      - --without-libnettle
      - --without-libgmp
      - --with-sqlite3
      - --with-zlib=/usr
      - --without-libcares
      - --without-libssh2
      - --without-libuv
      - --disable-rpath
    sources:
      - type: archive
        url: https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0.tar.xz
        sha256: 60a420ad7085eb616cb6e2bdf0a7206d68ff3d37fb5a956dc44242eb2f79b66b

  - name: httrack
    buildsystem: autotools
    config-opts:
      - --with-ssl=/usr
      - --with-zlib=/usr
      - --disable-rpath
    sources:
      - type: archive
        url: https://mirror.httrack.com/historical/httrack-3.49.2.tar.gz
        sha256: 3477a0e5568e241c63c9899accbfcdb6aadef2812fcce0173688567b4c7d4025

  - name: yt-dlp
    buildsystem: simple
    build-commands:
      - install -Dm755 yt-dlp /app/bin/yt-dlp
    sources:
      - type: file
        url: https://github.com/yt-dlp/yt-dlp/releases/download/2026.08.19/yt-dlp
        sha256: 1fa6733c37ea6fb51c99ad8fe785e7b7e5f3246c9b980230329d4fb72ed8d4d6

  - name: open-download-manager
    buildsystem: simple
    build-options:
      append-path: /app/jdk/bin:/app/maven/bin
      env:
        JAVA_HOME: /app/jdk
    build-commands:
      # Build the shaded jar offline from the vendored Maven repository.
      # repo.local must point at the repository directory itself
      # (.m2/repository), not its parent; otherwise Maven sees an empty repo
      # and offline resolution fails on the first plugin it resolves.
      - mvn -o -Dmaven.repo.local=.m2/repository -pl odm-gtk4 -am package -DskipTests
        -Djacoco.skip=true
      # Payload + trimmed runtime produced from the SDK JDK.
      # Version comes straight from the POM: prefix-based plugin resolution
      # (help:evaluate) would need Maven metadata files that are not vendored.
      - |
        VERSION="$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' pom.xml | head -1)"
        echo "$VERSION" > .odm-version
        install -Dm644 "odm-gtk4/target/odm-gtk4-${VERSION}-jar-with-dependencies.jar" \
          /app/opt/open-download-manager/odm.jar
      - |
        mkdir -p /app/opt/open-download-manager
        jlink --add-modules java.base,java.desktop,java.sql,java.logging,java.net.http,jdk.httpserver,jdk.crypto.ec,jdk.zipfs,jdk.unsupported,jdk.localedata,java.naming,java.management \
          --strip-debug --no-header-files --no-man-pages --compress zip-6 \
          --output /app/opt/open-download-manager/runtime
      - |
        mkdir -p /app/bin
        printf '%s\n' '#!/bin/sh' \
          'exec /app/opt/open-download-manager/runtime/bin/java --enable-native-access=ALL-UNNAMED -jar /app/opt/open-download-manager/odm.jar "$@"' \
          > /app/bin/open-download-manager
        chmod 755 /app/bin/open-download-manager
      # Desktop entry, metainfo and icons renamed to the app-id.
      - |
        mkdir -p /app/share/applications
        sed -e 's|^Exec=.*|Exec=open-download-manager %U|' \
            -e 's|^Icon=.*|Icon=io.github.odm_linux.open-download-manager|' \
            packaging/resources/open-download-manager.desktop \
            > /app/share/applications/io.github.odm_linux.open-download-manager.desktop
        chmod 644 /app/share/applications/io.github.odm_linux.open-download-manager.desktop
      - |
        VERSION="$(cat .odm-version)"
        mkdir -p /app/share/metainfo
        sed -e 's|<id>org.odm</id>|<id>io.github.odm_linux.open-download-manager</id>|' \
            -e 's|<launchable type="desktop-id">org.odm.desktop</launchable>|<launchable type="desktop-id">io.github.odm_linux.open-download-manager.desktop</launchable>|' \
            -e 's|<icon type="stock">open-download-manager</icon>|<icon type="stock">io.github.odm_linux.open-download-manager</icon>|' \
            -e "s/__VERSION__/${VERSION}/" -e "s/__DATE__/$(date +%F)/" \
            packaging/resources/org.odm.metainfo.xml \
            > /app/share/metainfo/io.github.odm_linux.open-download-manager.metainfo.xml
        chmod 644 /app/share/metainfo/io.github.odm_linux.open-download-manager.metainfo.xml
      - |
        for d in odm-gtk4/src/main/resources/icons/hicolor/*/apps; do
          size="$(basename "$(dirname "$d")")"
          dest="/app/share/icons/hicolor/$size/apps"
          mkdir -p "$dest"
          for f in "$d"/open-download-manager.*; do
            [ -f "$f" ] || continue
            install -m644 "$f" "$dest/io.github.odm_linux.open-download-manager.${f##*.}"
          done
        done
      - install -Dm644 LICENSE /app/share/licenses/io.github.odm_linux.open-download-manager/LICENSE
    sources:
      - type: git
        url: https://github.com/albilu/open-download-manager.git
        tag: v0.3.0
        commit: 3b513aec4467d61b283c24a2d0fadd8e8d49c9dd
      # Vendored Maven repository (see SUBMISSION.md); commit alongside this manifest.
      - maven-sources.yml
