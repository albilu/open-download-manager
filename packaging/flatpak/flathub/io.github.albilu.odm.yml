# Flathub submission manifest for Open Download Manager.
# Unlike packaging/flatpak/io.github.albilu.odm.yml (which consumes the prebuilt stage tree),
# this manifest builds the application from the git source offline, as required
# by Flathub. Maven dependencies must be vendored into maven-sources.yml first:
#
#   pip3 install --user aiohttp toml
#   curl -O https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/maven/flatpak-maven-generator.py
#   python3 flatpak-maven-generator.py /path/to/odm/pom.xml maven-sources.yml \
#       --batch-mode  # run from the repo root; see SUBMISSION.md
#
# Screenshots must be added to the metainfo before submission (see SUBMISSION.md).
app-id: io.github.albilu.odm
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
# Pin the extension branch that provides JDK 25 or newer (build requires 25).
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk
command: open-download-manager
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --share=network
  - --filesystem=home
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  # The in-code GTK application id (org.odm) predates the flatpak id.
  - --own-name=org.odm
build-options:
  append-path: /usr/lib/sdk/openjdk/bin
  env:
    JAVA_HOME: /usr/lib/sdk/openjdk
modules:
  - name: aria2
    buildsystem: autotools
    config-opts:
      - --with-libxml2
      - --without-expat
      - --with-openssl
      - --without-gnutls
      - --without-libgcrypt
      - --without-libnettle
      - --without-libgmp
      - --with-sqlite3
      - --with-zlib=/usr
      - --without-libcares
      - --without-libssh2
      - --without-libuv
      - --disable-rpath
    sources:
      - type: archive
        url: https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0.tar.xz
        sha256: 60a420ad7085eb616cb6e2bdf0a7206d68ff3d37fb5a956dc44242eb2f79b66b

  - name: httrack
    buildsystem: autotools
    config-opts:
      - --with-ssl=/usr
      - --with-zlib=/usr
      - --disable-rpath
    sources:
      - type: archive
        url: https://mirror.httrack.com/historical/httrack-3.49.2.tar.gz
        sha256: 3477a0e5568e241c63c9899accbfcdb6aadef2812fcce0173688567b4c7d4025

  - name: yt-dlp
    buildsystem: simple
    build-commands:
      - install -Dm755 yt-dlp /app/bin/yt-dlp
    sources:
      - type: file
        url: https://github.com/yt-dlp/yt-dlp/releases/download/2026.08.19/yt-dlp
        sha256: 1fa6733c37ea6fb51c99ad8fe785e7b7e5f3246c9b980230329d4fb72ed8d4d6

  - name: open-download-manager
    buildsystem: simple
    build-commands:
      # Build the shaded jar offline from the vendored Maven repository.
      - mvn -o -Dmaven.repo.local=.m2 -pl odm-gtk4 -am package -DskipTests
        -Djacoco.skip=true
      # Payload + trimmed runtime produced from the SDK JDK.
      - |
        VERSION="$(mvn -q -o -N -Dmaven.repo.local=.m2 help:evaluate -Dexpression=project.version -DforceStdout)"
        echo "$VERSION" > .odm-version
        install -Dm644 "odm-gtk4/target/odm-gtk4-${VERSION}-jar-with-dependencies.jar" \
          /app/opt/open-download-manager/odm.jar
      - |
        mkdir -p /app/opt/open-download-manager
        jlink --add-modules java.base,java.desktop,java.sql,java.logging,java.net.http,jdk.httpserver,jdk.crypto.ec,jdk.zipfs,jdk.unsupported,jdk.localedata,java.naming,java.management \
          --strip-debug --no-header-files --no-man-pages --compress zip-6 \
          --output /app/opt/open-download-manager/runtime
      - |
        mkdir -p /app/bin
        printf '%s\n' '#!/bin/sh' \
          'exec /app/opt/open-download-manager/runtime/bin/java --enable-native-access=ALL-UNNAMED -jar /app/opt/open-download-manager/odm.jar "$@"' \
          > /app/bin/open-download-manager
        chmod 755 /app/bin/open-download-manager
      # Desktop entry, metainfo and icons renamed to the app-id.
      - |
        mkdir -p /app/share/applications
        sed -e 's|^Exec=.*|Exec=open-download-manager %U|' \
            -e 's|^Icon=.*|Icon=io.github.albilu.odm|' \
            packaging/resources/open-download-manager.desktop \
            > /app/share/applications/io.github.albilu.odm.desktop
        chmod 644 /app/share/applications/io.github.albilu.odm.desktop
      - |
        VERSION="$(cat .odm-version)"
        mkdir -p /app/share/metainfo
        sed -e 's|<id>org.odm</id>|<id>io.github.albilu.odm</id>|' \
            -e 's|<launchable type="desktop-id">org.odm.desktop</launchable>|<launchable type="desktop-id">io.github.albilu.odm.desktop</launchable>|' \
            -e 's|<icon type="stock">open-download-manager</icon>|<icon type="stock">io.github.albilu.odm</icon>|' \
            -e "s/__VERSION__/${VERSION}/" -e "s/__DATE__/$(date +%F)/" \
            packaging/resources/org.odm.metainfo.xml \
            > /app/share/metainfo/io.github.albilu.odm.metainfo.xml
        chmod 644 /app/share/metainfo/io.github.albilu.odm.metainfo.xml
      - |
        for d in odm-gtk4/src/main/resources/icons/hicolor/*/apps; do
          size="$(basename "$(dirname "$d")")"
          dest="/app/share/icons/hicolor/$size/apps"
          mkdir -p "$dest"
          for f in "$d"/open-download-manager.*; do
            [ -f "$f" ] || continue
            install -m644 "$f" "$dest/io.github.albilu.odm.${f##*.}"
          done
        done
      - install -Dm644 LICENSE /app/share/licenses/io.github.albilu.odm/LICENSE
    sources:
      - type: git
        url: https://github.com/albilu/odm.git
        tag: __GIT_TAG__
        commit: __GIT_COMMIT__
      # Generated by flatpak-maven-generator; commit alongside this manifest.
      - maven-sources.yml
